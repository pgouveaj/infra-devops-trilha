<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel de Status</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding-top: 80px;
    }

    .painel {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 10px #cccccc;
    }

    .status {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="painel">
    <h1>Painel de Status</h1>

    <p>Aplicação: <span class="status">Online</span></p>
    <p>Ambiente: Laboratório</p>
    <p>Provisionado com Ansible</p>
    <p>Servidor web: Nginx</p>
  </div>
</body>
</html>
